name: genrevibes_feedback_ui
description: The feedback and contact sheet for GenRevibes apps — email, message and optional screenshots, sent through any FeedbackProvider, and laid out to stay usable with the keyboard open.
version: 0.1.0-dev.1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  genrevibes_core: ^0.1.0-dev.1
  genrevibes_feedback: ^0.1.0-dev.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
