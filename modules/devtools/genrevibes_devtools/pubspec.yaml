name: genrevibes_devtools
description: On-device diagnostics bench for exercising every GenRevibes capability.
version: 0.1.0-dev.1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  genrevibes_ads: ^0.1.0-dev.1
  genrevibes_analytics: ^0.1.0-dev.1
  genrevibes_app_links: ^0.1.0-dev.1
  genrevibes_app_rating: ^0.1.0-dev.1
  genrevibes_consent: ^0.1.0-dev.1
  genrevibes_core: ^0.1.0-dev.1
  genrevibes_crash: ^0.1.0-dev.1
  genrevibes_device_identity: ^0.1.0-dev.1
  genrevibes_engagement: ^0.1.0-dev.1
  genrevibes_feedback: ^0.1.0-dev.1
  genrevibes_iap: ^0.1.0-dev.1
  genrevibes_notifications: ^0.1.0-dev.1
  genrevibes_onboarding: ^0.1.0-dev.1
  genrevibes_permissions: ^0.1.0-dev.1
  genrevibes_remote_config: ^0.1.0-dev.1
  genrevibes_remote_policy: ^0.1.0-dev.1
  genrevibes_settings: ^0.1.0-dev.1
  genrevibes_starter_kit: ^0.1.0-dev.1
  genrevibes_storage: ^0.1.0-dev.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
