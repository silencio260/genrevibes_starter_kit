name: genrevibes_ads_appodeal_native
description: Appodeal native ads for GenRevibes apps, rendered in Appodeal's Android native ad view.
version: 0.1.0-dev.4
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  genrevibes_ads: ^0.1.0-dev.4
  genrevibes_ads_appodeal: ^0.1.0-dev.3
  genrevibes_core: ^0.1.0-dev.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

# Android only. Appodeal's Flutter plugin initializes and caches native ads but
# cannot render them; this plugin reaches the SDK that plugin already ships.
flutter:
  plugin:
    platforms:
      android:
        package: com.genrevibes.ads_appodeal_native
        pluginClass: GenRevibesAppodealNativePlugin
