name: genrevibes_smoke_app
description: Native Android/iOS compile and plugin-registration smoke app for the GenRevibes package family.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  genrevibes_ads:
    path: ../../packages/genrevibes_ads
  genrevibes_app_links_launcher:
    path: ../../packages/genrevibes_app_links_launcher
  genrevibes_crash_crashlytics:
    path: ../../packages/genrevibes_crash_crashlytics
  genrevibes_device_identity_platform:
    path: ../../packages/genrevibes_device_identity_platform
  genrevibes_permissions_handler:
    path: ../../packages/genrevibes_permissions_handler
  genrevibes_ads_admob:
    path: ../../packages/genrevibes_ads_admob
  genrevibes_ads_admob_ui:
    path: ../../packages/genrevibes_ads_admob_ui
  genrevibes_analytics_firebase:
    path: ../../packages/genrevibes_analytics_firebase
  genrevibes_analytics_mixpanel:
    path: ../../packages/genrevibes_analytics_mixpanel
  genrevibes_analytics_mixpanel_replay:
    path: ../../packages/genrevibes_analytics_mixpanel_replay
  genrevibes_analytics_posthog:
    path: ../../packages/genrevibes_analytics_posthog
  genrevibes_iap_revenuecat:
    path: ../../packages/genrevibes_iap_revenuecat
  genrevibes_iap_revenuecat_ui:
    path: ../../packages/genrevibes_iap_revenuecat_ui
  genrevibes_notifications_local:
    path: ../../packages/genrevibes_notifications_local
  genrevibes_notifications_onesignal:
    path: ../../packages/genrevibes_notifications_onesignal
  genrevibes_remote_config_firebase:
    path: ../../packages/genrevibes_remote_config_firebase
  genrevibes_remote_config_shared_preferences:
    path: ../../packages/genrevibes_remote_config_shared_preferences
  genrevibes_starter_kit:
    path: ../../packages/genrevibes_starter_kit

  genrevibes_app_rating_in_app_review:
    path: ../../packages/genrevibes_app_rating_in_app_review
  genrevibes_consent_ump:
    path: ../../packages/genrevibes_consent_ump
  genrevibes_feedbacknest:
    path: ../../packages/genrevibes_feedbacknest
  genrevibes_storage_shared_preferences:
    path: ../../packages/genrevibes_storage_shared_preferences

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  genrevibes_ads:
    path: ../../packages/genrevibes_ads
  genrevibes_app_links:
    path: ../../packages/genrevibes_app_links
  genrevibes_crash:
    path: ../../packages/genrevibes_crash
  genrevibes_device_identity:
    path: ../../packages/genrevibes_device_identity
  genrevibes_permissions:
    path: ../../packages/genrevibes_permissions
  genrevibes_ads_admob:
    path: ../../packages/genrevibes_ads_admob
  genrevibes_analytics:
    path: ../../packages/genrevibes_analytics
  genrevibes_core:
    path: ../../packages/genrevibes_core
  genrevibes_iap:
    path: ../../packages/genrevibes_iap
  genrevibes_iap_revenuecat:
    path: ../../packages/genrevibes_iap_revenuecat
  genrevibes_notifications:
    path: ../../packages/genrevibes_notifications
  genrevibes_remote_config:
    path: ../../packages/genrevibes_remote_config

  genrevibes_app_rating:
    path: ../../packages/genrevibes_app_rating
  genrevibes_consent:
    path: ../../packages/genrevibes_consent
  genrevibes_feedback:
    path: ../../packages/genrevibes_feedback
  genrevibes_storage:
    path: ../../packages/genrevibes_storage

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
