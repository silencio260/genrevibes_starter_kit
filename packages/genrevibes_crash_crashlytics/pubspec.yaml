name: genrevibes_crash_crashlytics
description: Firebase Crashlytics adapter and framework error hooks for GenRevibes crash reporting.
version: 0.1.0-dev.1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  firebase_core: ">=3.15.2 <4.0.0"
  firebase_crashlytics: ">=4.3.10 <5.0.0"
  flutter:
    sdk: flutter
  genrevibes_core: ^0.1.0-dev.1
  genrevibes_crash: ^0.1.0-dev.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  genrevibes_crash_test: ^0.1.0-dev.1
